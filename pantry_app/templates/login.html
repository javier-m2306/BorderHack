{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-16">
  <div class="text-center mb-10">
    <h1 class="text-5xl font-black uppercase tracking-tighter leading-none mb-2">Account</h1>
    <p class="text-gray-500 font-bold uppercase tracking-tight">Sign in to save your QR across pages</p>
  </div>

  {% if error %}
  <div class="mb-6 bg-red-50 border-2 border-red-400 text-red-700 font-bold uppercase text-sm px-4 py-3 rounded-xl">
    {{ error }}
  </div>
  {% endif %}

  <!-- Login -->
  <div class="bg-white border-4 border-black rounded-2xl p-8 shadow-2xl mb-8">
    <h2 class="text-2xl font-black uppercase tracking-tight mb-6 border-b-2 border-black pb-3">Sign In</h2>
    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-black uppercase text-gray-400 mb-1">Student ID</label>
        <input type="text" name="number" placeholder="e.g. S001"
          class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 font-bold uppercase focus:border-blue-600 focus:outline-none transition" required>
      </div>
      <button type="submit"
        class="w-full bg-blue-600 text-white py-4 font-black uppercase rounded-lg hover:bg-blue-700 transition transform active:scale-95">
        Sign In
      </button>
    </form>
  </div>

  <!-- Register -->
  <div class="bg-white border-2 border-gray-100 rounded-2xl p-8 shadow-lg">
    <h2 class="text-2xl font-black uppercase tracking-tight mb-6 border-b-2 border-gray-100 pb-3">New Account</h2>
    <form action="/register" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-black uppercase text-gray-400 mb-1">Student ID</label>
        <input type="text" name="number" placeholder="e.g. S002"
          class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 font-bold uppercase focus:border-blue-600 focus:outline-none transition" required>
      </div>
      <div>
        <label class="block text-xs font-black uppercase text-gray-400 mb-1">Full Name</label>
        <input type="text" name="name" placeholder="Alex Rivera"
          class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 font-bold focus:border-blue-600 focus:outline-none transition" required>
      </div>
      <div>
        <label class="block text-xs font-black uppercase text-gray-400 mb-1">Email</label>
        <input type="email" name="email" placeholder="student@utep.edu"
          class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 font-bold focus:border-blue-600 focus:outline-none transition" required>
      </div>
      <button type="submit"
        class="w-full bg-black text-white py-4 font-black uppercase rounded-lg hover:bg-gray-800 transition transform active:scale-95">
        Create Account
      </button>
    </form>
  </div>

  <p class="text-center text-gray-400 text-xs font-bold uppercase mt-8">
    No ID check. Your privacy is our priority.
  </p>
</div>
{% endblock %}
