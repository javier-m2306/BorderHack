<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Pantry</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background-color: #f8f9fa; color: #333; }
.stealth-card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
</style>
</head>
<body class="bg-white text-black font-sans">
<header class="border-b border-gray-200 py-4 px-8 flex justify-between items-center bg-white sticky top-0 z-50">
  <div class="flex items-center gap-2">
    <div class="w-10 h-10 bg-blue-900 rounded-full flex items-center justify-center text-white font-bold">P</div>
    <span class="text-2xl font-black uppercase tracking-tighter text-blue-900">Pantry Portal</span>
  </div>
  <div class="flex gap-6 font-bold text-sm items-center">
    <a href="/" class="hover:text-blue-700">MAP</a>
    <a href="/build" class="hover:text-blue-700">ORDER</a>

    {% if session.get('account_id') %}
      <!-- Logged-in: show name, My QR link, and logout -->
      <a href="/my-qr" class="hover:text-blue-700 flex items-center gap-1">
        <span>🎫</span> My QR
      </a>
      <span class="text-gray-400">|</span>
      <span class="text-gray-600">{{ session.get('account_name', '') }}</span>
      <a href="/logout" class="bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded font-bold text-xs uppercase transition">Log Out</a>
    {% else %}
      <!-- Guest: show login link -->
      <a href="/login" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-black uppercase text-xs transition">
        Sign In / Register
      </a>
    {% endif %}
  </div>
</header>
<main class="max-w-6xl mx-auto px-6 py-12">
  {% block content %}{% endblock %}
</main>
</body>
</html>
